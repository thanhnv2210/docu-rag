<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Back page (shadow) -->
  <rect x="7" y="9" width="16" height="20" rx="2" fill="#0f766e" opacity="0.3"/>
  <!-- Middle page -->
  <rect x="5" y="6" width="16" height="20" rx="2" fill="#0f766e" opacity="0.6"/>
  <!-- Front page -->
  <rect x="3" y="3" width="16" height="20" rx="2" fill="#0f766e"/>
  <!-- Page lines -->
  <line x1="7" y1="9"  x2="15" y2="9"  stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="7" y1="13" x2="15" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="7" y1="17" x2="12" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Spark / star in top-right -->
  <g transform="translate(22, 6)">
    <!-- 4-point star -->
    <path d="M4 0 L4.8 3.2 L8 4 L4.8 4.8 L4 8 L3.2 4.8 L0 4 L3.2 3.2 Z"
          fill="#14b8a6"/>
    <!-- Small sparkle dot -->
    <circle cx="8.5" cy="0.5" r="1" fill="#14b8a6" opacity="0.7"/>
  </g>
</svg>
